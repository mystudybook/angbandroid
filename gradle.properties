# Project-wide Gradle configuration for AGP 9.0 / Gradle 9.1 / JDK 21.
# Do not commit machine-specific JDK/SDK paths; use Android Studio's Gradle JDK
# selector, JAVA_HOME, and the ignored local.properties for SDK/ABI_FILTERS.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Preserve old resource resolution and switch(R.id.*) semantics in the
# legacy codebase until it has been migrated and verified on Android.
android.nonTransitiveRClass=false
android.nonFinalResIds=false

// AGP 9 enables a separate compile-time non-final R class by default.
// Preserve the project's existing switch/case R.id usage until migrated.
android.enableAppCompileTimeRClass=false

// Pure Java Android project: avoid adding unused built-in Kotlin compilation.
// This can be removed if Kotlin sources are added later.
android.builtInKotlin=false
