apply plugin: 'com.android.application'

// Android Studio writes SDK paths to local.properties. Its ABI_FILTERS entry
// is optional for backwards compatibility with existing local checkouts.
// Prefer -PABI_FILTERS=x86_64 or ~/.gradle/gradle.properties for local overrides.
def debugAbiSpec = providers.gradleProperty('ABI_FILTERS').orNull
if (!debugAbiSpec) {
    def localFile = rootProject.file('local.properties')
    if (localFile.isFile()) {
        def localProperties = new Properties()
        localFile.withInputStream { input -> localProperties.load(input) }
        debugAbiSpec = localProperties.getProperty('ABI_FILTERS')
    }
}
// Most Android phones and Apple Silicon Android emulators are ARM64.
// A standard Intel emulator can use -PABI_FILTERS=x86_64 instead.
if (!debugAbiSpec?.trim()) debugAbiSpec = 'arm64-v8a'
def my_abi_filters = debugAbiSpec.split(/[,;]/)
    .collect { it.trim() }.findAll { it }.unique()
def supportedAbis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
if (!my_abi_filters.every { supportedAbis.contains(it) }) {
    throw new GradleException(
        "Invalid ABI_FILTERS: ${debugAbiSpec}. Valid values: ${supportedAbis.join(', ')}")
}

android {
    // Required by AGP 8+. Keep the original applicationId for local upgrades.
    namespace "org.rephial.xyangband"
    compileSdk 35

    // Preserve the known native toolchain while migrating Gradle/JDK.
    // Upgrade NDK/CMake separately after validating native compilation.
    ndkVersion "21.0.6113669"
    defaultConfig {
        applicationId "org.rephial.xyangband"
        minSdkVersion 22
        targetSdk 34
        versionCode 105
        versionName "1.38.2"
        externalNativeBuild {
            cmake {
                // flags for the c++ compiler eg "-std=c++14 -frtti -fexceptions"
                // If you set cppFlags to "-std=c++14", you may need to build your boost libraries
                // with the same flags, depending on your compiler defaults.
                // cppFlags "-std=c++14"

                // this causes libc++_shared.so to get packaged into .apk
                //arguments '-DANDROID_STL=c++_shared'

                // This is used in CMakeLists.txt so our native code can find/use (prebuilt) boost
                //arguments '-DMY_BOOST_LIBS_DIR=' + my_boost_dir_libs
                // Only this one for tome 2.4.0
                //arguments '-DMY_BOOST_INC_DIR='  + my_boost_dir_inc
            }
        }
    }
    // Build and compile with a JDK 21 toolchain. Android 5.1 remains
    // supported by using Java 17 language/bytecode compatibility instead
    // of requiring Java 21 runtime APIs on Android devices.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        debug {
            ndk {
                abiFilters = []
                abiFilters.addAll(my_abi_filters.split(';').collect{it as String})
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'FULL' }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.10.2"
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}


