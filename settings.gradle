// Gradle 9.1.0 can run on JDK 21 through 25; use JDK 21 for
// reproducible Android Studio and command-line builds.
if (JavaVersion.current() < JavaVersion.VERSION_21 ||
        JavaVersion.current() > JavaVersion.VERSION_25) {
    throw new GradleException(
        "Angbandroid's Gradle 9.1.0 build requires JDK 21-25 (21 recommended). " +
        "Set Android Studio > Settings > Build Tools > Gradle > Gradle JDK to JDK 21 " +
        "or export JAVA_HOME to a JDK 21 installation. Current JDK: " +
        System.getProperty("java.version"))
}

include ':app'
rootProject.name='angbandroid'
