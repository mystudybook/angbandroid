// The Android build intentionally uses JDK 21 or newer (not JDK 17).
// Gradle 8.11.1 runs on Java 21, 22 and 23; prefer JDK 21 for reproducibility.
if (JavaVersion.current() < JavaVersion.VERSION_21) {
    throw new GradleException(
        "Angbandroid requires JDK 21 or newer to run Gradle. " +
        "Set Android Studio > Settings > Build Tools > Gradle > Gradle JDK to JDK 21 " +
        "or export JAVA_HOME to a JDK 21 installation. Current JDK: " +
        System.getProperty("java.version"))
}

include ':app'
rootProject.name='angbandroid'
