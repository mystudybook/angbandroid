// Gradle 8.11.1 supports running on JDK 21 through 23.
// Prefer JDK 21 for reproducible local builds. JDK 24+ requires a newer
// Gradle release and a separate AGP compatibility review.
if (JavaVersion.current() < JavaVersion.VERSION_21 ||
        JavaVersion.current() > JavaVersion.VERSION_23) {
    throw new GradleException(
        "Angbandroid's Gradle 8.11.1 build requires JDK 21-23 (21 recommended). " +
        "Set Android Studio > Settings > Build Tools > Gradle > Gradle JDK to JDK 21 " +
        "or export JAVA_HOME to a JDK 21 installation. Current JDK: " +
        System.getProperty("java.version"))
}

include ':app'
rootProject.name='angbandroid'
